[project]
name = "recallos-api"
version = "2.1.0"
description = "RecallOS FastAPI backend — hybrid RAG, multi-hop agent, connectors, memory"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "asyncpg>=0.30.0",
  "httpx>=0.27.0",
  "boto3>=1.35.0",
  "redis>=5.2.0",
  "qdrant-client>=1.12.0",
  "fastembed>=0.4.0",
  "python-multipart>=0.0.12",
  "orjson>=3.10.0",
  "sse-starlette>=2.1.0",
]

[project.scripts]
recallos-api = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
